# Offline checks on every pull request and push: no RBI or MoSPI calls, only fixtures in tests/fixtures.
name: Tests

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pipeline checks (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Page render checks (Node)
        run: node tests/test_render.js
      - name: Committed data passes validation
        run: python3 pipeline/validate.py
