<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India Macro Monitor</title>
<meta name="description" content="Official Indian macroeconomic data from MoSPI and the Reserve Bank of India: GDP, CPI, IIP, repo rate, G-Sec yields, forex reserves, bank credit and the rupee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  /* Design tokens matching the names the shared page CSS uses. Light first, dark via the OS setting. */
  :root {
    --color-bg: #fbfbf9; --color-panel: #ffffff; --color-fg: #1d2127; --color-fg-muted: #5d6570;
    --color-border-line: #e3e5e8; --color-ok: #1f7a4d; --color-warn: #a86400; --color-bad: #b3362d;
    --c1: #1f5fbf; --c2: #d2691e; --c3: #2e8b57; --c4: #8a3fb8; --c5: #b8860b;
    --cds-chart-muted: #a3a9b1; --cds-chart-grid: #eceef1; --cds-chart-axis: #c4c9cf; --cds-chart-reference: #6b7480;
    --cds-chart-status-critical: #b3362d; --cds-text-secondary: #5d6570;
    --cds-surface-popover: #ffffff; --cds-border: #d6d9de; --cds-shadow-popover: 0 6px 20px rgba(20, 24, 31, .12);
    --font-anthropic-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-anthropic-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --cds-font-size-caption: 12.5px; --cds-font-size-body: 15px; --cds-font-size-heading: 19px; --cds-font-size-title: 30px;
    --cds-font-weight-medium: 600;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 14px; --cds-gap-lg: 20px; --cds-gap-xl: 32px;
    --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px; --cds-pad-xl: 24px;
    --cds-radius: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #121418; --color-panel: #1a1d22; --color-fg: #e8eaed; --color-fg-muted: #9aa2ad;
      --color-border-line: #2c3138; --color-ok: #4cc38a; --color-warn: #e0a640; --color-bad: #f07167;
      --c1: #6ea8fe; --c2: #f4a261; --c3: #5fd3a0; --c4: #c39bf0; --c5: #e9c46a;
      --cds-chart-muted: #5f6670; --cds-chart-grid: #23272d; --cds-chart-axis: #3a4048; --cds-chart-reference: #8f98a3;
      --cds-chart-status-critical: #f07167; --cds-text-secondary: #9aa2ad;
      --cds-surface-popover: #22262c; --cds-border: #353b43; --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; }
  #dash-root { max-width: 1240px; margin: 0 auto; padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .dash-select { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background-color: var(--color-panel);
    border: 1px solid var(--color-border-line); border-radius: 6px; padding: 6px 10px; }
  [hidden] { display: none !important; }
  .site-foot { margin-top: 32px; color: var(--color-fg-muted); font-size: 12.5px; }
  .site-foot a { color: inherit; }
</style>
</head>
<body>
<div id="dash-root">
<!-- PAGE -->
<noscript><p class="site-foot">Interactive charts require JavaScript. <a href="data/observations.json">Download chart observations (JSON)</a> or <a href="data/catalog.json">view series definitions (JSON)</a>.</p></noscript>
<p class="site-foot">Data: Ministry of Statistics and Programme Implementation (MoSPI) and Reserve Bank of India. Rebuilt daily by a GitHub Action; published only when validation passes.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="dash-shim.js"></script>
<script src="app.js"></script>
</body>
</html>
